<div class="container mt-5 position-relative">
  @if (mostrarVolver) {
    <div class="mb-3">
      <app-boton-volver ruta="/firma-metodos"></app-boton-volver>
    </div>
  }
  <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="card-title mb-3">{{ firmaMetodo.nombre }}</h4>

    <p class="card-text">
      <strong>Tipo retorno:</strong> {{ firmaMetodo.tipoRetorno ?? 'N/A' }}
    </p>

    @if (firmaMetodo.parametros.length > 0) {
      <div class="mt-0">
        <strong>Parámetros:</strong>
        <ul>
          @for (p of firmaMetodo.parametros; track p.id) {
            <li>{{ p.nombre }}</li>
          }
        </ul>
      </div>
    }

    @if (onEliminar) {
      <div class="mt-3" (click)="$event.stopPropagation()">
        <app-boton-eliminar [id]="firmaMetodo.id" [onEliminar]="onEliminar"></app-boton-eliminar>
      </div>
    }
  </div>
</div>
