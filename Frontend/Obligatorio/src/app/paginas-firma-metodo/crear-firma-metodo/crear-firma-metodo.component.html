<h3 class="card-title text-center mt-5 mb-4">Crear firma método</h3>
<form [formGroup]="formulario" (submit)="crear()" class="bg-white mx-auto mt-4 mb-5 p-4 border rounded shadow-sm" 
style="max-width: 500px;">
    <div class="form-group mb-3">
        <label for="nombre" class="form-label fw-bold">Nombre:</label>
        <input id="nombre" type="text" formControlName="nombre" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="tipoDato" class="form-label fw-bold">Tipo de dato de retorno:</label>
        <select id="tipoDato" formControlName="tipoDato" class="form-select">
            <option value="">-- Seleccione un tipo --</option>
            @for (tipo of tiposDato; track tipo.id) {
                <option [value]="tipo.id">{{ tipo.nombre }}</option>
            }
        </select>
    </div>

    <div class="form-group mb-3">
        <label class="form-label fw-bold">Parámetros:</label>
        <div class="d-flex">
            <select [formControl]="parametroSeleccionado" class="form-select me-2">
                <option [ngValue]="null">-- Seleccione los parámetros --</option>
                @for (param of parametrosDisponibles; track param.id) {
                    <option [ngValue]="param">{{ param.nombre }}</option>
                }
            </select>
            <button class="btn btn-primary" type="button" (click)="agregarParametro()" [disabled]="!parametroSeleccionado.value">
                Agregar
            </button>
        </div>

        <ul class="mt-3 list-group">
            @for (param of parametros.controls; let i = $index; track $index) {
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ param.value.nombre }} 
                    @if (param.value.tipoDato) {
                        ({{ param.value.tipoDato.nombre }})
                    }
                    <button class="btn btn-sm btn-danger" (click)="eliminarParametro(i)">Quitar</button>
                </li>
            }
        </ul>
    </div>

    <div class="d-flex justify-content-between mt-3">
        <app-boton-cancelar></app-boton-cancelar>
        <app-boton-crear [disabled]="formulario.invalid"></app-boton-crear>
    </div>
</form>
