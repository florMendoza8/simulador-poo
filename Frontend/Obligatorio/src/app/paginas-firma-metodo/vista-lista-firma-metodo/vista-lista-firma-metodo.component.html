<div class="container mt-5 pb-5 position-relative">
  <div class="position-relative mb-0" style="min-height: 2.5rem;">
    <div class="position-absolute start-0">
      <app-boton-volver ruta="/"></app-boton-volver>
    </div>

    <h3 class="text-center m-0 position-absolute top-50 start-50 translate-middle">
      Firma de métodos existentes
    </h3>
  </div>

  @if (firmaMetodos.length === 0) {
    <div class="text-center mt-5">
      <p class="text-muted">No hay firma de metodos aún.</p>
    </div>
  } @else {
    <div class="row row-cols-1 row-cols-3 g-3">
      @for (firmaMetodo of firmaMetodos; track firmaMetodo.id) {
        <div class="col d-flex">
          <div class="w-100 h-100" (click)="verDetalle(firmaMetodo.id)" style="cursor: pointer;">
            <app-vista-firma-metodo [firmaMetodo]="firmaMetodo"></app-vista-firma-metodo>
          </div>
        </div>
      }
    </div>
  }
</div>
