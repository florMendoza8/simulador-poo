@if (atributo){
<div class="container mt-5 position-relative">
    @if (mostrarVolver) {
    <div class="mb-3">
      <app-boton-volver ruta="/atributos"></app-boton-volver>
    </div>
  }
  <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="card-title mb-3">{{ atributo.nombre }}</h4>

    <p class="card-text">
      <strong>Tipo de dato:</strong> {{ atributo.tipoReferencia.nombre ?? 'N/A' }}
    </p>

    <p class="card-text">
      <strong>Accesibilidad:</strong> {{ atributo.accesibilidad }}
    </p>

    <p class="card-text">
      @if (atributo.esEstatico) {
        <span>Static</span>
      }
    </p>

    @if (onEliminar) {
      <div class="mt-3" (click)="$event.stopPropagation()">
        <app-boton-eliminar [id]="atributo.id" [onEliminar]="onEliminar"></app-boton-eliminar>
      </div>
    }

    @if (onModificar) {
      <div class="mt-3" (click)="$event.stopPropagation()">
        <app-boton-modificar [id]="atributo.id" [onModificar]="onModificar"></app-boton-modificar>
      </div>
    }
  </div>
</div>
}
