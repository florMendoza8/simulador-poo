<div class="container mt-5 pb-5 position-relative">
  <div class="position-relative mb-0" style="min-height: 2.5rem;">
    <div class="position-absolute start-0">
      <app-boton-volver ruta="/"></app-boton-volver>
    </div>

    <h3 class="text-center m-0 position-absolute top-50 start-50 translate-middle">
      Atributos existentes
    </h3>
  </div>

  <div class="row row-cols-1 row-cols-3 g-3">
    @for (atributo of atributos; track atributo.id) {
      <div class="col d-flex">
        <div class="w-100 h-100" (click)="verDetalle(atributo.id)" style="cursor: pointer;">
          <app-vista-atributo [atributo]="atributo"></app-vista-atributo>
        </div>
      </div>
    }
  </div>
</div>
