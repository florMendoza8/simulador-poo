<h3 class="card-title text-center mt-5 mb-4">Modificar atributo</h3>

<form [formGroup]="formulario" (submit)="modificar()" class="bg-white mx-auto mt-4 p-4 border rounded shadow-sm" 
style="max-width: 500px;">

    <div class="form-group mb-3">
        <label for="nombre" class="form-label fw-bold">Nombre:</label>
        <input id="nombre" type="text" formControlName="nombre" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="tipoDato" class="form-label fw-bold">Tipo de dato:</label>
        <select id="tipoDato" formControlName="tipoDato" class="form-select">
            <option value="">-- Seleccione un tipo --</option>
            @for (tipo of tiposDato; track tipo.id) {
                <option [value]="tipo.id">{{ tipo.nombre }}</option>
            }
        </select>
    </div>

    <div class="form-group mb-3">
        <label for="accesibilidad" class="form-label fw-bold">Accesibilidad:</label>
        <select id="accesibilidad" formControlName="accesibilidad" class="form-select">
            <option [ngValue]="null">-- Seleccione una opción --</option>
            @for (opcion of accesibilidades; track opcion) {
                <option [ngValue]="opcion">{{ opcion }}</option>
            }
        </select>
    </div>

    <div class="row">
        <div class="col-6">
            <label class="form-label mb-1 fw-bold">Es estático:</label>
            <div class="mb-2">
                <div class="form-check form-check-inline">
                    <input type="radio" id="estaticoSi" [value]="true" formControlName="esEstatico" class="form-check-input" name="esEstatico" />
                    <label class="form-check-label" for="estaticoSi">Sí</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" id="estaticoNo" [value]="false" formControlName="esEstatico" class="form-check-input" name="esEstatico" />
                    <label class="form-check-label" for="estaticoNo">No</label>
                </div>
            </div>
          </div>
     </div>

    <div class="d-flex justify-content-between mt-3">
      <app-boton-cancelar ruta="/atributos"></app-boton-cancelar>
      <app-boton-guardar-cambios [disabled]="formulario.invalid"></app-boton-guardar-cambios>
    </div>

</form>
