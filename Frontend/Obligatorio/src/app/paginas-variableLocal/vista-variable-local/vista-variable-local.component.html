@if(variable){
  <div class="container mt-5">
    <div *ngIf="rutaEsDetalle" class="mb-3">
      <app-boton-volver ruta="/variable"></app-boton-volver>
    </div>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
      <h4 class="card-title mb-3">{{ variable.nombre }}</h4>

      <p class="card-text">
        <strong>Tipo referencia:</strong> {{ variable.tipoReferencia?.nombre ?? 'N/A' }}
      </p>

      <p class="card-text">
        <strong>Valor:</strong> {{ variable.valor }}
      </p>

    </div>
  </div>
}
