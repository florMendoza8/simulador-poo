<h3 class="card-title text-center mt-5 mb-4">Crear interfaz</h3>

<form [formGroup]="formulario" (submit)="crear()" class="bg-white mx-auto mt-4 p-4 border rounded shadow-sm" 
style="max-width: 500px;">

    <div class="form-group mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input id="nombre" type="text" formControlName="nombre" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label class="form-label fw-bold">Firmas de métodos:</label>
        <div class="d-flex">
            <select [formControl]="metodoSeleccionado" class="form-select me-2">
                <option [ngValue]="null">-- Seleccione los métodos --</option>
                @for (metodo of metodosDisponibles; track metodo.id) {
                    <option [ngValue]="metodo">{{ metodo.nombre }}</option>
                }
            </select>
            <button class="btn btn-primary" type="button" (click)="agregarMetodo()" [disabled]="!metodoSeleccionado.value">
                Agregar
            </button>
        </div>

        <ul class="mt-3 list-group">
            @for (metodo of firmaMetodos.controls; let i = $index; track $index) {
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ metodo.value.nombre }} 
                    @if (metodo.value.tipoDato) {
                        ({{ metodo.value.tipoDato.nombre }})
                    }
                    <button class="btn btn-sm btn-danger" (click)="eliminarMetodo(i)">Quitar</button>
                </li>
            }
        </ul>
    </div>

    <div class="d-flex justify-content-between mt-3">
      <app-boton-cancelar></app-boton-cancelar>
      <app-boton-crear [disabled]="formulario.invalid"></app-boton-crear>
    </div>
</form>
