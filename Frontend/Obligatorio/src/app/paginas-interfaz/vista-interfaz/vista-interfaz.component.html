@if (interfaz) {
<div class="container mt-5 position-relative">
  @if (mostrarVolver) {
    <div class="mb-3">
      <app-boton-volver ruta="/interfaces"></app-boton-volver>
    </div>
  }
  <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="card-title mb-3">{{ interfaz.nombre }}</h4>
    
    @if (interfaz.firmaMetodos.length > 0) {
      <div class="mt-0">
        <strong>Firmas de métodos:</strong>
        <ul>
          @for (i of interfaz.firmaMetodos; track i.id) {
            <li>{{ i.nombre }}</li>
          }
        </ul>
      </div>
    }    

    @if (onEliminar) {
      <div class="mt-3" (click)="$event.stopPropagation()">
        <app-boton-eliminar [id]="interfaz.id" [onEliminar]="onEliminar"></app-boton-eliminar>
      </div>
    }
  </div>
</div>
}
